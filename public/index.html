<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111315" />
  <title>Shitlist</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">■</span>
        <span class="brand-name">SHITLIST</span>
        <span class="slash">/</span>
        <button id="teamName" class="team-name" title="Rename team">PRODUCT TEAM</button>
      </div>
      <div class="summary" id="summary"></div>
    </header>

    <nav class="filters" id="filters" aria-label="Board filters"></nav>

    <main class="board">
      <section class="table-wrap" aria-label="Team queue">
        <div class="table-head row">
          <div>PRI</div>
          <div>WORK</div>
          <div>OWNER</div>
          <div>STATUS</div>
          <div>AGE</div>
        </div>
        <div id="taskRows"></div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="panel-title">BLOCKERS</div>
          <div id="blockers" class="stack muted"></div>
        </section>

        <section class="panel">
          <div class="panel-title">UNOWNED</div>
          <div id="unowned" class="stack muted"></div>
        </section>

        <section class="panel">
          <div class="panel-title">PULSE</div>
          <div id="pulse" class="pulse"></div>
        </section>
      </aside>
    </main>

    <footer class="composer">
      <span class="prompt">+</span>
      <input id="quickAdd" autocomplete="off" placeholder="add work..." maxlength="180" />
      <button id="addButton" class="key">ENTER</button>
    </footer>
  </div>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <div class="dialog-head">
        <div>
          <span class="eyebrow" id="dialogId">NEW</span>
          <h2 id="dialogTitle">Add work</h2>
        </div>
        <button type="button" class="icon-button" id="closeDialog" aria-label="Close">×</button>
      </div>

      <label>
        <span>Title</span>
        <input name="title" required maxlength="180" />
      </label>

      <div class="grid-two">
        <label>
          <span>Priority</span>
          <select name="priority">
            <option>P0</option>
            <option>P1</option>
            <option selected>P2</option>
            <option>P3</option>
          </select>
        </label>
        <label>
          <span>Status</span>
          <select name="status">
            <option>READY</option>
            <option>DOING</option>
            <option>BLOCKED</option>
            <option>REVIEW</option>
            <option>DONE</option>
          </select>
        </label>
      </div>

      <label>
        <span>Owner</span>
        <input name="owner" maxlength="80" placeholder="leave blank if unowned" />
      </label>

      <label>
        <span>Description</span>
        <textarea name="description" rows="5"></textarea>
      </label>

      <label>
        <span>Done when</span>
        <textarea name="doneWhen" rows="3" placeholder="What has to be true for this to be done?"></textarea>
      </label>

      <label id="blockedByWrap">
        <span>Blocked by</span>
        <input name="blockedBy" maxlength="500" />
      </label>

      <div class="dialog-actions">
        <button type="button" class="danger ghost" id="deleteTask">DELETE</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="cancelTask">CANCEL</button>
        <button type="submit">SAVE</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
